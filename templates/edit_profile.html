<!DOCTYPE html>
<html>

<head>

    <title>Edit Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">

</head>

<body>

<nav>

    <div class="logo">OrganLink</div>

    <ul>
        <li><a href="/profile">Profile</a></li>
    </ul>

</nav>

<div class="dashboard-container">

    <div class="profile-card">

        <h1>Edit Profile</h1>

        <form method="POST">

            <label>Age</label>
            <input
                type="number"
                name="age"
                value="{{ user[5] }}"
                required>

            <label>Gender</label>
            <select name="gender" required>
                <option value="Male"
                    {% if user[6] == 'Male' %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if user[6] == 'Female' %}selected{% endif %}>
                    Female
                </option>

                <option value="Other"
                    {% if user[6] == 'Other' %}selected{% endif %}>
                    Other
                </option>
            </select>

            <label>Blood Group</label>

<select name="blood_group" required>

    <option value="A+"
        {% if user[7] == 'A+' %}selected{% endif %}>
        A+
    </option>

    <option value="A-"
        {% if user[7] == 'A-' %}selected{% endif %}>
        A-
    </option>

    <option value="B+"
        {% if user[7] == 'B+' %}selected{% endif %}>
        B+
    </option>

    <option value="B-"
        {% if user[7] == 'B-' %}selected{% endif %}>
        B-
    </option>

    <option value="AB+"
        {% if user[7] == 'AB+' %}selected{% endif %}>
        AB+
    </option>

    <option value="AB-"
        {% if user[7] == 'AB-' %}selected{% endif %}>
        AB-
    </option>

    <option value="O+"
        {% if user[7] == 'O+' %}selected{% endif %}>
        O+
    </option>

    <option value="O-"
        {% if user[7] == 'O-' %}selected{% endif %}>
        O-
    </option>

</select>

            <label>Phone Number</label>
            <input
                type="text"
                name="phone"
                value="{{ user[8] }}"
                required>

            <button type="submit">
                Save Changes
            </button>

        </form>

    </div>

</div>

</body>
</html>
