<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OrganLink</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">OrganLink</div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/#about">Awareness</a></li>
            <li><a href="/register">Register</a></li>
            <li><a href="/#contact">Contact</a></li>
        </ul>

    </nav>

    <!-- LOGIN FORM -->

    <div class="container">

        <div class="form-box">

            <h1>Welcome Back</h1>

            <p>
                Login to your OrganLink account
            </p>

            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <p class="bottom-text">
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</body>
</html>
