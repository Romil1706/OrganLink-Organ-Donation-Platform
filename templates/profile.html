<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>

<nav>

    <div class="logo">OrganLink</div>

    <ul>
        <li><a href="/donor">Dashboard</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/">Logout</a></li>
    </ul>

</nav>

<div class="dashboard-container">

    <h1>My Profile</h1>

    <div class="card">

    <p><strong>Name:</strong> {{ user[1] }}</p>

    <p><strong>Email:</strong> {{ user[2] }}</p>

    <p><strong>Role:</strong> {{ user[4] }}</p>

    <p><strong>Age:</strong> {{ user[5] }}</p>

    <p><strong>Gender:</strong> {{ user[6] }}</p>

    <p><strong>Blood Group:</strong> {{ user[7] }}</p>

    <p><strong>Phone:</strong> {{ user[8] }}</p>
     <br>

    <a href="/edit_profile">
        <button>Edit Profile</button>
    </a>
</div>

</div>

</body>
</html>
