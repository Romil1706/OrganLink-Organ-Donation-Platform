<!DOCTYPE html>
<html>

<head>

    <title>Hospitals</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='dashboard.css') }}">

</head>

<body>

<nav>

    <div class="logo">
        OrganLink Admin
    </div>

    <ul>

        <li>
            <a href="/admin">Dashboard</a>
        </li>

        <li>
            <a href="/logout">Logout</a>
        </li>

    </ul>

</nav>

<div class="dashboard-container">

    <h1>Registered Hospitals</h1>

    <div class="cards">

        {% for hospital in hospitals %}

        <div class="card">

            <h2>
                {{ hospital[0] }}
            </h2>

            <p>
                <strong>Email:</strong>
                {{ hospital[1] }}
            </p>

            <p>
                <strong>Phone:</strong>
                {{ hospital[2] }}
            </p>

            <p>
                <strong>Address:</strong>
                {{ hospital[3] }}
            </p>

            <p>
                <strong>Area:</strong>
                {{ hospital[4] }}
            </p>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
