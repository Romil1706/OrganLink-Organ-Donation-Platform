<!DOCTYPE html>
<html>
<head>

    <title>All Recipients</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">

</head>
<body>

<nav>

    <div class="logo">OrganLink</div>

    <ul>
        <li><a href="/hospital">Dashboard</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>

</nav>

<div class="dashboard-container">

    <h1>Registered Recipients</h1>

    <table>

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Blood Group</th>
            <th>Phone</th>
        </tr>

        {% for recipient in recipients %}

        <tr>

            <td>{{ recipient[0] }}</td>
            <td>{{ recipient[1] }}</td>
            <td>{{ recipient[2] }}</td>
            <td>{{ recipient[3] }}</td>
            <td>{{ recipient[4] }}</td>
            <td>{{ recipient[5] }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
